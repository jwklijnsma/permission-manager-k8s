apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "permission-manager.fullname" . }}
  labels:
    {{- include "permission-manager.labels" . | nindent 4 }}
spec:
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      {{- include "permission-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "permission-manager.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "permission-manager.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "permission-manager.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PORT
              value: "4000"
            {{- if not .Values.config.basicAuthEnabled }}
            - name: BASIC_AUTH_DISABLED
              value: "true"
            {{- end }}
            {{- with .Values.config.basicAuthUsername }}
            - name: BASIC_AUTH_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.additionalSubjectKinds }}
            - name: ADDITIONAL_SUBJECT_KINDS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: KUBECONFIG_TOKEN_MODE
              value: {{ .Values.config.kubeconfig.tokenMode | default "secret" | quote }}
            {{- with .Values.config.kubeconfig.tokenExpiration }}
            - name: KUBECONFIG_TOKEN_EXPIRATION
              value: {{ . | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "permission-manager.secretName" . }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 4000
          readinessProbe:
            tcpSocket:
              port: 4000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
