{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "permission-manager.fullname" . }}
  labels:
    {{- include "permission-manager.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  CLUSTER_NAME: {{ required ".config.clusterName is required. Its value will be used in the generated user kubeconfig to identify the cluster." .Values.config.clusterName | quote }}
  CONTROL_PLANE_ADDRESS: {{ required ".config.controlPlaneAddress is required. Its value will be used in the generated user kubeconfig as the address of the Kubernetes API server." .Values.config.controlPlaneAddress | quote }}
  {{- if .Values.config.basicAuthEnabled }}
  BASIC_AUTH_PASSWORD: {{ required "config.basicAuthPassword is required when config.basicAuthEnabled is true. Its value will be used as the password to access Permission Manager's UI" .Values.config.basicAuthPassword | quote }}
  {{- end }}
{{- end }}
